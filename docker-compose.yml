services:
  db:
    image: mcr.microsoft.com/mssql/server:2022-latest
    container_name: flashgateway_db
    ports:
      - "1433:1433"
    environment:
      ACCEPT_EULA: "Y"
      SA_PASSWORD: "Your_P@ssw0rd!"
      MSSQL_PID: "Developer"
    volumes:
      - db_data:/var/opt/mssql
    healthcheck:
      test: ["CMD-SHELL", "/opt/mssql-tools18/bin/sqlcmd -S localhost -U sa -P \"$${SA_PASSWORD}\" -C -Q \"SELECT 1\""]
      interval: 10s
      timeout: 10s
      retries: 15
    networks:
      - flashgateway

  db-init:
    image: mcr.microsoft.com/mssql-tools
    depends_on:
      db:
        condition: service_healthy
    environment:
      SA_PASSWORD: "Your_P@ssw0rd!"
    volumes:
      - ./db:/tmp
    entrypoint: ["/bin/sh", "-lc"]
    command: |
      set -e
      /opt/mssql-tools18/bin/sqlcmd -S db -U sa -P "$${SA_PASSWORD}" -C -d master -i /tmp/01-schema.sql
      /opt/mssql-tools18/bin/sqlcmd -S db -U sa -P "$${SA_PASSWORD}" -C -d FlashGateway -i /tmp/02-seed.sql
    restart: "no"
    networks:
      - flashgateway

  api:
    build:
      context: ./api
      dockerfile: Dockerfile
    depends_on:
      db:
        condition: service_healthy
      db-init:
        condition: service_completed_successfully
    ports:
      - "4000:4001"
    environment:
      PORT: "4001"
      DB_SERVER: db
      DB_NAME: FlashGateway
      DB_USER: sa
      DB_PASSWORD: "Your_P@ssw0rd!"
      DB_PORT: "1433"
      JWT_SECRET: "flashgateway-local-secret"
    networks:
      - flashgateway

  web:
    build:
      context: ./web
      dockerfile: Dockerfile
      args:
        VITE_API_URL: "http://localhost:4000"
    ports:
      - "80:80"
    depends_on:
      - api
    networks:
      - flashgateway

volumes:
  db_data:

networks:
  flashgateway:
    driver: bridge
